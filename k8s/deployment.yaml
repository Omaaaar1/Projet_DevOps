apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project-deployment
  labels:
    app: devops-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      containers:
      - name: devops-project-container
        image: python:3.9-slim  # En production, ce serait ton image DockerHub
        imagePullPolicy: IfNotPresent
        command: ["python", "app.py"] # S'assure que l'app se lance
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-project-service
spec:
  selector:
    app: devops-project
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer