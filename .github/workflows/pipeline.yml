name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, feature-update-readme ]
  pull_request:
    branches: [ main, feature-update-readme ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code
    - name: Récupération du code
      uses: actions/checkout@v2

    # 2. Installation Python
    - name: Installation de Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    # 3. Installation dépendances
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest

    # 4. Sécurité SAST (Code)
    # Analyse le code source pour trouver des failles
    - name: Analyse de Sécurité (SAST - Bandit)
      run: bandit -r app.py || true

    # 5. Build Docker
    - name: Construction Image Docker
      run: docker build -t my-devops-app .

    # --- DAST (Nouveau) ---

    # 6. Lancer l'application pour le DAST
    # Le DAST a besoin d'une application qui tourne pour l'attaquer
    - name: Lancer le conteneur
      run: |
        docker run -d -p 5000:5000 --name dast-target my-devops-app
        sleep 10 # On attend 10s que le serveur soit prêt

    # 7. Sécurité DAST (OWASP ZAP)
    # Scanne l'application lancée à la recherche de failles Web
    - name: Analyse de Sécurité (DAST - OWASP ZAP)
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        fail_action: false
        allow_issue_writing: false