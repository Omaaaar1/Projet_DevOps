name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, feature-update-readme ]
  pull_request:
    branches: [ main, feature-update-readme ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v2

    - name: Installation de Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest

    # SAST (Bandit)
    - name: Analyse de Sécurité (SAST - Bandit)
      run: bandit -r app.py || true

    # Build Docker (Vérification)
    - name: Construction Image Docker
      run: docker build -t my-devops-app .

    # --- DAST PROPRE ET SIMPLE ---

    # 1. On lance le conteneur en mode "détaché" sur le réseau de l'hôte
    - name: Lancer l'application
      run: |
        docker run -d --network host --name my-app-running my-devops-app
        sleep 5

    # 2. Vérification rapide que l'app répond
    - name: Vérifier l'application
      run: curl -v http://localhost:5000/ || echo "App not ready yet"

    # 3. Scan ZAP (DAST)
    # On utilise l'action officielle mais sans essayer de générer/uploader des rapports complexes qui échouent
    - name: Analyse de Sécurité (DAST - OWASP ZAP)
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        # Ne pas bloquer le build sur des warnings
        fail_action: false
        # Désactiver l'écriture de fichiers de rapport qui cause des problèmes de permission
        allow_issue_writing: false
        # Ne pas créer d'artefact "zap_scan" automatiquement (source de l'erreur)
        artifact_name: 'zap-scan-results'