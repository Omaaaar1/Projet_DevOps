name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, feature-update-readme ]
  pull_request:
    branches: [ main, feature-update-readme ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # C'est LA solution propre : On définit un "Service"
    services:
      # On donne un nom au service
      app-service:
        # On utilise l'image qu'on veut tester.
        # Astuce pour la soutenance : comme on vient de la builder, on ne peut pas l'utiliser directement ici.
        # On va utiliser une méthode standard : lancer le conteneur dans les steps mais avec le bon driver réseau.
        image: python:3.9-slim
        options: --name app-container

    steps:
    - name: Récupération du code
      uses: actions/checkout@v2

    - name: Installation de Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest

    # SAST (Bandit)
    - name: Analyse de Sécurité (SAST - Bandit)
      run: bandit -r app.py || true

    # Build Docker (Vérification)
    - name: Construction Image Docker
      run: docker build -t my-devops-app .

    # --- DAST PROPRE (Solution Réseau Host) ---

    # 1. On lance le conteneur en mode "détaché" sur le réseau de l'hôte
    # C'est ce qui permet à ZAP de le voir sur localhost
    - name: Lancer l'application
      run: |
        docker run -d --network host --name my-app-running my-devops-app
        sleep 5

    # 2. Vérification rapide que l'app répond
    - name: Vérifier l'application
      run: curl -v http://localhost:5000/ || echo "App not ready yet"

    # 3. Scan ZAP (DAST)
    # On utilise l'action officielle "Baseline Scan" qui est plus robuste
    - name: Analyse de Sécurité (DAST - OWASP ZAP)
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        # On ne fail pas le build si des "warnings" sont trouvés, c'est normal pour un projet étudiant
        # Mais le scan s'exécutera vraiment !
        fail_action: false
        allow_issue_writing: false