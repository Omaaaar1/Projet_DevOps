name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, feature-update-readme ]
  pull_request:
    branches: [ main, feature-update-readme ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v2

    - name: Installation de Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest

    - name: Analyse de Sécurité (SAST - Bandit)
      run: bandit -r app.py || true

    - name: Construction Image Docker
      run: docker build -t my-devops-app .

    # CORRECTION : Créer un réseau Docker
    - name: Créer un réseau Docker
      run: docker network create test-network

    # CORRECTION : Lancer l'app sur le réseau
    - name: Lancer le conteneur
      run: |
        docker run -d --name dast-target --network test-network my-devops-app
        sleep 10

    # CORRECTION : Vérifier que l'app fonctionne
    - name: Vérifier l'application
      run: |
        docker logs dast-target
        docker exec dast-target curl -f http://localhost:5000 || echo "App may not be ready"

    # CORRECTION : Scanner avec ZAP sur le même réseau
    - name: Analyse de Sécurité (DAST - OWASP ZAP)
      run: |
        docker run --network test-network -v $(pwd):/zap/wrk/:rw \
          -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://dast-target:5000 \
          -r zap-report.html || true

    # CORRECTION : Nettoyer
    - name: Nettoyage
      if: always()
      run: |
        docker stop dast-target || true
        docker rm dast-target || true
        docker network rm test-network || true

    # BONUS : Publier le rapport ZAP
    - name: Publier le rapport ZAP
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: zap-report
        path: zap-report.html