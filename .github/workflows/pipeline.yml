name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code (Checkout)
      uses: actions/checkout@v2

    - name: Installation de Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest

    - name: Analyse de Sécurité (SAST)
      # Valide le critère "Security: SAST scan"
      run: bandit -r app.py

    - name: Construction Image Docker
      # Valide le critère "CI/CD: Build"
      run: docker build -t my-devops-app .

    - name: Test de l'image Docker
      run: docker run -d -p 5000:5000 --name test-container my-devops-app && sleep 5 && docker logs test-con